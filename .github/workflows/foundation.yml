name: Foundation tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build -t foundation:test .
      - run: docker run --rm --read-only foundation:test python -c 'from main import app'
      - run: GRAFANA_PASSWORD=validation-only docker compose -f compose.yaml -f compose.observability.yaml config --quiet
