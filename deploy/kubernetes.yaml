apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evalgate
  template:
    metadata:
      labels:
        app: evalgate
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics/
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: evalgate:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: evalgate-api
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: evalgate
spec:
  selector:
    app: evalgate
  ports:
    - name: http
      port: 8000
      targetPort: http
